<!doctype html>
<html>
  <head lang="en">
    <meta charset="utf-8" />
    <script src="js/sdpi-components.js"></script>
    <script src="js/connection-status.js"></script>
  </head>
  <body>
    <sdpi-item label="Scene">
      <sdpi-select setting="sceneId" datasource="scenes" loading="Fetching scenes..." hot-reload>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Remote control Web URL">
      <sdpi-textfield setting="url" placeholder="http://localhost" global></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Status">
      <sdpi-textfield id="connectionStatus" readonly placeholder=""></sdpi-textfield>
    </sdpi-item>
  </body>
</html>
