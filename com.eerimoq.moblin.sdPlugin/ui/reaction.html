<!doctype html>
<html>
  <head lang="en">
    <meta charset="utf-8" />
    <script src="js/sdpi-components.js"></script>
    <script src="js/connection-status.js"></script>
  </head>
  <body>
    <sdpi-item label="Reaction">
      <sdpi-select setting="reactionName">
        <option value="">Select a reaction...</option>
        <option value="fireworks">Fireworks</option>
        <option value="balloons">Balloons</option>
        <option value="hearts">Hearts</option>
        <option value="confetti">Confetti</option>
        <option value="lasers">Lasers</option>
        <option value="rain">Rain</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Remote control Web URL">
      <sdpi-textfield setting="url" placeholder="http://localhost" global></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Status">
      <sdpi-textfield id="connectionStatus" readonly placeholder=""></sdpi-textfield>
    </sdpi-item>
  </body>
</html>
