<!doctype html>
<html>
  <head lang="en">
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Filter">
      <sdpi-select setting="filterName">
        <option value="">Select a filter...</option>
        <option value="pixellate">Pixellate</option>
        <option value="movie">Movie</option>
        <option value="grayScale">Gray scale</option>
        <option value="sepia">Sepia</option>
        <option value="triple">Triple</option>
        <option value="twin">Twin</option>
        <option value="fourThree">4:3</option>
        <option value="pinch">Pinch</option>
        <option value="whirlpool">Whirlpool</option>
        <option value="poll">Poll</option>
        <option value="blurFaces">Blur faces</option>
        <option value="privacy">Privacy</option>
        <option value="beauty">Beauty</option>
        <option value="moblinInMouth">Moblin in mouth</option>
        <option value="cameraMan">Camera man</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Remote control Web URL">
      <sdpi-textfield setting="url" placeholder="http://localhost" global></sdpi-textfield>
    </sdpi-item>
  </body>
</html>
